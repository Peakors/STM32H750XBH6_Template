# FK750M5-XBH6 / STM32H750XBH6 单外部 Flash 四线下载算法
# 支持：W25Q8 / 16 / 32 / 64 / 128 / 256 / 512
# 引脚：CLK=PF10, NCS=PG6, IO0=PF8, IO1=PF9, IO2=PF7, IO3=PF6
#
# 工作模式：
#   1. reset-init：初始化 GPIO/QUADSPI，识别 JEDEC，保持普通 SPI 并 probe。
#   2. GDB/CLion 下载：gdb-flash-erase-start 进入 QPI 4-4-4 擦除、写入和校验，
#      结束后 gdb-flash-write-end 退出 QPI，恢复 bootloader 使用的 0xEB 1-4-4 映射。
#   3. 命令行 program：全程普通 SPI，由 stmqspi 驱动按 SFDP 自行选择命令，
#      结束后 Flash 不残留 QPI 模式，bootloader 可直接启动。
#
# 说明：
#   - QPI 4-4-4：指令、地址、数据均使用四线。
#   - 0xEB 1-4-4：指令单线，地址和数据四线。
#   - 0x90000000 是 STM32H750 QUADSPI 的内存映射地址。
#   - 参考 OpenOCD 官方 stm32h7x_dual_qspi.cfg，并替换为 Winbond 命令。
#
# Author: Peakors

# ===== 调试器接口配置（本文件默认使用 DAPLink）=====
# 若使用 ST-Link 或 J-Link，请注释掉 DAPLink 行并取消对应行的注释
# （同一时间只能启用一个调试器）
# DAPLink（默认启用）
adapter driver cmsis-dap
# ST-Link
# source [find interface/stlink.cfg]
# J-Link
# source [find interface/jlink.cfg]

transport select swd

set CHIPNAME STM32H750XBH6
set QUADSPI 1
source [find target/stm32h7x.cfg]
reset_config srst_only

# =============================================================================
# 1. QUADSPI 寄存器地址
# =============================================================================

set QSPI_CR  0x52005000
set QSPI_DCR 0x52005004
set QSPI_SR  0x52005008
set QSPI_FCR 0x5200500C
set QSPI_DLR 0x52005010
set QSPI_CCR 0x52005014
set QSPI_AR  0x52005018
set QSPI_DR  0x52005020
set _QSPINAME $_CHIPNAME.qspi

# =============================================================================
# 2. Flash 几何参数
#    JEDEC 识别后会自动更新容量、FSIZE 和地址长度。
#    ADSIZE=2 表示 24 位地址，ADSIZE=3 表示 32 位地址。
# =============================================================================

set QSPI_JEDEC_ID 0
set QSPI_FLASH_SIZE 0x800000
set QSPI_ADSIZE 2
set QSPI_USE_4BYTE 0

# =============================================================================
# 3. QUADSPI 基础传输函数
# =============================================================================

# 终止当前 QUADSPI 操作，等待 BUSY 清零并清除状态标志。
proc qspi_abort {} {
	global QSPI_CR QSPI_SR QSPI_FCR
	mmw $QSPI_CR 0x00000002 0
	for {set i 0} {$i < 2000} {incr i} {
		if {([mrw $QSPI_SR] & 0x20) == 0} {
			break
		}
	}
	mww $QSPI_FCR 0x0000001B
}

# 等待传输完成标志 TCF；成功返回 0，超时返回 1。
proc qspi_wait_tcf {{timeout_ms 2000}} {
	global QSPI_SR QSPI_FCR
	for {set i 0} {$i < $timeout_ms} {incr i} {
		if {[mrw $QSPI_SR] & 0x02} {
			mww $QSPI_FCR 0x0000001B
			return 0
		}
		sleep 1
	}
	echo "***** qspi_wait_tcf timeout"
	mww $QSPI_FCR 0x0000001B
	return 1
}

# 发送无地址、无数据的命令。
# imode=1：单线指令；imode=3：四线指令。
proc qspi_instr { instr {imode 1} } {
	global QSPI_CCR QSPI_FCR
	qspi_abort
	mww $QSPI_FCR 0x0000001B
	mww $QSPI_CCR [expr {(($imode & 3) << 8) | ($instr & 0xFF)}]
	return [qspi_wait_tcf]
}

# 单线发送命令并写入一个寄存器字节。
proc qspi_write_u8 { instr data } {
	global QSPI_DLR QSPI_CCR QSPI_DR QSPI_FCR
	qspi_abort
	mww $QSPI_FCR 0x0000001B
	mww $QSPI_DLR 0
	mww $QSPI_CCR [expr {0x01000100 | ($instr & 0xFF)}]
	write_memory $QSPI_DR 8 [list [expr {$data & 0xFF}]]
	return [qspi_wait_tcf]
}

# 执行无地址读命令并返回字节列表。
# imode/dmode：1 表示单线，3 表示四线。
proc qspi_read_bytes { instr nbytes {imode 1} {dmode 1} } {
	global QSPI_DLR QSPI_CCR QSPI_DR QSPI_SR QSPI_FCR
	qspi_abort
	mww $QSPI_FCR 0x0000001B
	mww $QSPI_DLR [expr {$nbytes - 1}]
	set ccr [expr {0x04000000 | (($dmode & 3) << 24) | (($imode & 3) << 8) | ($instr & 0xFF)}]
	mww $QSPI_CCR $ccr

	for {set i 0} {$i < 200} {incr i} {
		set sr [mrw $QSPI_SR]
		if {($sr & 0x02) || ((($sr >> 8) & 0x3F) >= $nbytes)} {
			break
		}
		sleep 1
	}

	set result {}
	for {set n 0} {$n < $nbytes} {incr n} {
		lappend result [lindex [read_memory $QSPI_DR 8 1] 0]
	}
	qspi_wait_tcf 50
	return $result
}

# 读取一个状态/配置寄存器字节。
proc qspi_read_u8 { instr } {
	return [lindex [qspi_read_bytes $instr 1 1 1] 0]
}

# 按指定指令线数和数据线数读取三字节 JEDEC ID。
proc qspi_read_jedec_mode { imode dmode } {
	set bytes [qspi_read_bytes 0x9F 3 $imode $dmode]
	set id 0
	foreach b $bytes {
		set id [expr {($id << 8) | ($b & 0xFF)}]
	}
	return $id
}

# 在普通 SPI 1-1 模式下读取 JEDEC ID。
proc qspi_read_jedec {} {
	return [qspi_read_jedec_mode 1 1]
}

# =============================================================================
# 4. JEDEC 容量识别
#    EF4014/15/16/17/18/19/20 对应 W25Q8/16/32/64/128/256/512。
# =============================================================================

# 根据 JEDEC 容量码设置 DCR.FSIZE 和 24/32 位地址模式。
proc qspi_configure_geometry { jedec } {
	global QSPI_DCR QSPI_JEDEC_ID QSPI_FLASH_SIZE QSPI_ADSIZE QSPI_USE_4BYTE

	set QSPI_JEDEC_ID $jedec
	set capacity [expr {$jedec & 0xFF}]
	set fsize -1
	set size_mbit 0

	if {($jedec & 0xFFFF00) != 0xEF4000} {
		echo [format "***** WARNING: unsupported JEDEC family 0x%06X" $jedec]
		return 1
	}

	if {$capacity == 0x14} {
		set fsize 19
		set size_mbit 8
	} elseif {$capacity == 0x15} {
		set fsize 20
		set size_mbit 16
	} elseif {$capacity == 0x16} {
		set fsize 21
		set size_mbit 32
	} elseif {$capacity == 0x17} {
		set fsize 22
		set size_mbit 64
	} elseif {$capacity == 0x18} {
		set fsize 23
		set size_mbit 128
	} elseif {$capacity == 0x19} {
		set fsize 24
		set size_mbit 256
	} elseif {$capacity == 0x20} {
		set fsize 25
		set size_mbit 512
	} else {
		echo [format "***** WARNING: unsupported W25Q capacity code 0x%02X" $capacity]
		return 1
	}

	set QSPI_FLASH_SIZE [expr {1 << ($fsize + 1)}]
	if {$QSPI_FLASH_SIZE > 0x1000000} {
		set QSPI_ADSIZE 3
		set QSPI_USE_4BYTE 1
	} else {
		set QSPI_ADSIZE 2
		set QSPI_USE_4BYTE 0
	}

	# Keep CKMODE=1 and update FSIZE dynamically.
	mww $QSPI_DCR [expr {($fsize << 16) | 0x00000001}]
	echo [format "***** W25Q%d detected: %d bytes, FSIZE=%d, address=%d-bit" \
		$size_mbit $QSPI_FLASH_SIZE $fsize [expr {($QSPI_ADSIZE + 1) * 8}]]
	return 0
}

# =============================================================================
# 5. W25Q 状态、复位、QE 和四字节地址
# =============================================================================

# 轮询状态寄存器 1 的 WIP(bit0)，等待擦除/写入完成。
proc qspi_wait_wip {{timeout_ms 5000}} {
	for {set i 0} {$i < $timeout_ms} {incr i} {
		if {([qspi_read_u8 0x05] & 0x01) == 0} {
			return 0
		}
		sleep 1
	}
	echo "***** qspi_wait_wip timeout"
	return 1
}

# 发送 Write Enable(0x06)，并确认 WEL(bit1) 已置位。
proc qspi_write_enable {} {
	qspi_instr 0x06 1
	for {set i 0} {$i < 100} {incr i} {
		if {[qspi_read_u8 0x05] & 0x02} {
			return 0
		}
		sleep 1
	}
	echo "***** write enable failed"
	return 1
}

# 四线发送 0xFF 退出 QPI；Flash 已处于 SPI 时该操作无害。
proc qspi_exit_qpi {} {
	# Harmless if the device is already in normal SPI mode.
	qspi_instr 0xFF 3
	sleep 1
}

# 发送 0x66 + 0x99，将 Flash 恢复到确定的 SPI 状态。
proc qspi_spi_reset {} {
	qspi_instr 0x66 1
	qspi_instr 0x99 1
	sleep 2
}

# W25Q256/512 容量超过 16 MiB，需要发送 0xB7 进入四字节地址模式。
proc qspi_enter_4byte_mode {} {
	global QSPI_USE_4BYTE
	if {$QSPI_USE_4BYTE} {
		# W25Q256: Enter 4-Byte Address Mode.
		qspi_instr 0xB7 1
		sleep 1
		echo "***** 4-byte address mode active"
	}
}

# 检查 SR2.QE(bit1)，必要时保留 SR2 其他位并置位 QE。
proc qspi_enable_qe {} {
	qspi_exit_qpi
	qspi_spi_reset

	set sr2 [qspi_read_u8 0x35]
	if {($sr2 & 0x02) == 0} {
		echo [format "***** Enabling W25Qxx QE (SR2 was 0x%02X)" $sr2]
		qspi_write_enable
		qspi_write_u8 0x31 [expr {$sr2 | 0x02}]
		qspi_wait_wip
		set sr2 [qspi_read_u8 0x35]
		echo [format "***** W25Qxx SR2 now 0x%02X" $sr2]
	} else {
		echo [format "***** W25Qxx QE already set (SR2=0x%02X)" $sr2]
	}
}

# =============================================================================
# 6. 内存映射和 QPI 模式
# =============================================================================

# 普通 SPI READ 0x03，1-1-1 内存映射。
# 主要用于安全回退和 OpenOCD 初始探测。
proc qspi_mmap_spi {} {
	global QSPI_CCR QSPI_ADSIZE
	qspi_abort
	# FMODE=3, DMODE=1, ADMODE=1, IMODE=1, INSTR=0x03.
	mww $QSPI_CCR [expr {0x0D000503 | ($QSPI_ADSIZE << 12)}]
}

# Fast Read Quad I/O 0xEB，1-4-4 内存映射。
# 下载结束后使用，与 bootloader 的运行模式一致。
proc qspi_mmap_eb {} {
	global QSPI_CCR QSPI_ADSIZE
	qspi_abort
	# FMODE=3, DMODE=3, DCYC=6, ADMODE=3, IMODE=1, INSTR=0xEB.
	mww $QSPI_CCR [expr {0x0F180DEB | ($QSPI_ADSIZE << 12)}]
}

# QPI 下写一个寄存器字节：四线指令 + 四线数据。
proc qspi_qpi_write_u8 { instr data } {
	global QSPI_DLR QSPI_CCR QSPI_DR QSPI_FCR
	qspi_abort
	mww $QSPI_FCR 0x0000001B
	mww $QSPI_DLR 0
	mww $QSPI_CCR [expr {0x03000300 | ($instr & 0xFF)}]
	write_memory $QSPI_DR 8 [list [expr {$data & 0xFF}]]
	return [qspi_wait_tcf]
}

# 进入 Winbond QPI：
#   0x38 进入 QPI -> 四线 JEDEC 校验 -> 0xC0 设置 8 dummy clocks
#   -> 配置 0x0B QPI Fast Read 4-4-4，供 stmqspi 缓存。
proc qspi_enter_qpi_mode {} {
	global QSPI_CCR QSPI_ADSIZE QSPI_JEDEC_ID

	# Enter QPI (0x38) is sent in normal SPI mode.
	qspi_abort
	qspi_instr 0x38 1
	sleep 2

	# A valid 4-line JEDEC response confirms that this exact part supports QPI.
	set qpi_jedec [qspi_read_jedec_mode 3 3]
	if {$qpi_jedec != $QSPI_JEDEC_ID} {
		error [format "QPI JEDEC mismatch: SPI=0x%06X QPI=0x%06X" \
			$QSPI_JEDEC_ID $qpi_jedec]
	}

	# W25Qxx resets QPI read latency to 2 clocks. P5:P4=11 selects
	# 8 dummy clocks, matching QUADSPI_CCR DCYC=8 at up to 133 MHz.
	qspi_qpi_write_u8 0xC0 0x30

	# FMODE=3, DMODE=3, DCYC=8,
	# ADMODE=3, IMODE=3, INSTR=0x0B (QPI Fast Read).
	qspi_abort
	mww $QSPI_CCR [expr {0x0F200F0B | ($QSPI_ADSIZE << 12)}]
	echo [format "***** QPI 4-4-4 active, CCR=0x%08X" [mrw $QSPI_CCR]]
}

# =============================================================================
# 7. GPIO、时钟和 QUADSPI 硬件初始化
# =============================================================================

proc qspi_hw_init {} {
	global QSPI_CR QSPI_DCR

	mmw 0x580244E0 0x000007FF 0
	mmw 0x580244D4 0x00004000 0
	sleep 1

	mmw 0x58021400 0x002AA000 0x00155000
	mmw 0x58021408 0x002AA000 0x00155000
	mmw 0x5802140C 0x00000000 0x003FF000
	mmw 0x58021420 0x99000000 0x66000000
	mmw 0x58021424 0x000009AA 0x00000655

	mmw 0x58021800 0x00002000 0x00001000
	mmw 0x58021808 0x00002000 0x00001000
	mmw 0x5802180C 0x00000000 0x00003000
	mmw 0x58021820 0x0A000000 0x05000000

	# PRESCALER=1。保持复位默认 64 MHz HSI 时，QSPI 时钟为 32 MHz。
	mww $QSPI_CR 0x01000F10
	# 先按 8 MiB 设置 FSIZE=22，读取 JEDEC 后再自动更新。
	mww $QSPI_DCR 0x00160001
	mmw $QSPI_CR 0x00000001 0

	qspi_enable_qe
	qspi_mmap_spi
}

# 完整初始化入口：硬件初始化、读取 JEDEC、配置容量并按需进入 QPI。
proc qspi_init { qpi } {
	qspi_hw_init
	set jedec [qspi_read_jedec]
	echo [format "***** JEDEC ID: 0x%06X" $jedec]

	if {[qspi_configure_geometry $jedec]} {
		error [format "Unsupported external flash JEDEC ID 0x%06X" $jedec]
	}

	qspi_enter_4byte_mode
	if {$qpi} {
		qspi_enter_qpi_mode
	} else {
		# 不进 QPI 时必须恢复内存映射模式（FMODE=3）再交给 stmqspi probe：
		# probe 从当前 CCR 推断驱动工作模式，若停留在 JEDEC 读取后的
		# 间接模式（FMODE=0），驱动推断的命令配置错误，擦除会失败
		# （实测报 Sector erase command not accepted, Status=0x02）。
		qspi_mmap_spi
	}
}

# =============================================================================
# 8. 下载模式与应用模式切换
# =============================================================================

# 退出 QPI，并恢复 bootloader 兼容的 0xEB 1-4-4 内存映射。
proc qspi_app_mode {} {
	global QSPI_USE_4BYTE
	echo "***** QSPI app mode: Exit QPI + mmap Fast Read Quad I/O 0xEB"
	qspi_abort
	qspi_instr 0xFF 3
	sleep 2
	qspi_spi_reset
	qspi_enter_4byte_mode
	qspi_mmap_eb
}

# 确保 Flash 进入 QPI 4-4-4，并让 stmqspi 重新缓存当前 CCR。
proc qspi_prog_mode {} {
	global _QSPINAME
	echo "***** QSPI prog mode: QPI 4-4-4 (stmqspi)"
	# Be deterministic even if the previous session left the flash in QPI.
	qspi_abort
	qspi_instr 0xFF 3
	sleep 2
	qspi_spi_reset
	qspi_enter_4byte_mode
	qspi_enter_qpi_mode
	# stmqspi caches the current CCR at probe time.
	catch {flash probe $_QSPINAME}
}

# =============================================================================
# 9. OpenOCD / GDB 事件
# =============================================================================

# reset init 时保持默认 HSI，配置 GPIO、QUADSPI，并以普通 SPI 模式 probe Flash。
# 注意：不能在这里进入 QPI —— 命令行 `program` 不经过 GDB 事件钩子，若在
# reset-init 进入 QPI，烧写结束后 Flash 将残留 QPI 模式，bootloader 的单线
# 命令无法识别（实测 JEDEC 读回乱码、boot 中止）。QPI 4-4-4 仅在 GDB 下载
# 流程中由 gdb-flash-erase-start -> qspi_prog_mode 启用，写入完成后由
# gdb-flash-write-end / gdb-attach 恢复 SPI + 0xEB 映射。
$_CHIPNAME.cpu0 configure -event reset-init {
	global QUADSPI _QSPINAME

	# 不在 OpenOCD 中切换 PLL，避免 CMSIS-DAP 在时钟切换后丢失 SWD-DP。
	adapter speed 4000

	if {$QUADSPI} {
		qspi_init 0
		catch {flash probe $_QSPINAME}
	}
}

# GDB 开始擦除前切换到 QPI 4-4-4。
$_CHIPNAME.cpu0 configure -event gdb-flash-erase-start {
	halt
	qspi_prog_mode
}

# GDB 下载完成后恢复 0xEB 1-4-4。
$_CHIPNAME.cpu0 configure -event gdb-flash-write-end {
	qspi_app_mode
}

# GDB 只附加不下载时，也恢复 bootloader 兼容的 1-4-4 映射。
$_CHIPNAME.cpu0 configure -event gdb-attach {
	qspi_app_mode
}
